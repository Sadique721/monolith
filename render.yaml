# ─────────────────────────────────────────────────────────────────────────────
# render.yaml — EntityKart Monolith Infrastructure-as-Code
# Author : Md Sadique Amin <mdsadiqueamin721786@gmail.com>
#
# Usage:
#   1. Push this file to your GitHub repo (it's already there via this commit).
#   2. On Render dashboard: New → Blueprint → connect repo → Render reads this file.
#   3. Fill in all env vars marked sync:false in the Render dashboard.
#
# Docs: https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: entitykart-monolith
    runtime: docker          # Java is NOT a native Render runtime — Docker is required
    dockerfilePath: ./Dockerfile
    plan: free               # Change to "starter" or higher for always-on (no cold starts)

    # Health check — Render uses this to detect a healthy deploy
    # /actuator/health is provided by spring-boot-starter-actuator (added in build.gradle.kts)
    healthCheckPath: /actuator/health

    # Render's auto-deploy on every push to main
    autoDeploy: true
    branch: main

    # ── Environment Variables ─────────────────────────────────────────────────
    # Variables marked  generateValue: true  are auto-generated by Render.
    # Variables marked  sync: false          must be set manually in the dashboard.
    # Variables with a  value:               are safe defaults (non-secret).
    envVars:

      # ── Database (Aiven Cloud MySQL) ────────────────────────────────────────
      - key: DB_HOST
        sync: false          # Set in Render dashboard: entitkart-mdsadiqueamin721786-entitykart.a.aivencloud.com
      - key: DB_PORT
        sync: false          # Set in Render dashboard: 20904
      - key: DB_NAME
        sync: false          # Set in Render dashboard: defaultdb
      - key: DB_USERNAME
        sync: false          # Set in Render dashboard: avnadmin
      - key: DB_PASSWORD
        sync: false          # Set in Render dashboard: your Aiven password
      - key: DB_USE_SSL
        value: "true"        # Aiven requires SSL — do NOT change to false in production

      # ── JWT Secrets (generate strong random values!) ────────────────────────
      # Run: openssl rand -base64 48
      - key: JWT_SECRET
        sync: false          # MUST be set — app refuses to start if placeholder is used
      - key: JWT_REFRESH_SECRET
        sync: false          # MUST be set — app refuses to start if placeholder is used

      # ── App URLs (replace with your actual Render URL after first deploy) ───
      - key: APP_URL
        sync: false          # e.g. https://entitykart-monolith.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # e.g. https://entitykart-monolith.onrender.com

      # ── Email (Gmail SMTP) ──────────────────────────────────────────────────
      - key: MAIL_USERNAME
        sync: false          # mdsadiqueamin721786@gmail.com
      - key: MAIL_PASSWORD
        sync: false          # Gmail App Password (16-char, not account password)

      # ── Cloudinary ──────────────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Authorize.Net ───────────────────────────────────────────────────────
      - key: AUTHORIZE_NET_API_LOGIN_ID
        sync: false
      - key: AUTHORIZE_NET_TRANSACTION_KEY
        sync: false
      - key: AUTHORIZE_NET_ENVIRONMENT
        value: sandbox       # Change to "production" when ready for live payments

      # ── Razorpay (future — not yet wired up in business logic) ──────────────
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # ── Twilio (future — not yet wired up in business logic) ─────────────────
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

      # ── Admin ───────────────────────────────────────────────────────────────
      - key: ADMIN_EMAIL
        value: admin@entitykart.com
