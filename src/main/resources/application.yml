server:
  port: 8080

spring:
  application:
    name: entitykart-monolith
  datasource:
    # ─── LOCAL MySQL (active) ────────────────────────────────────────────────
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:entitykart_database}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:0721}
    # ─── Aiven Cloud MySQL (enable after whitelisting IP in Aiven console) ───
    # Copy credentials from Aiven Console → Connection Info
    # Set env vars: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      pool-name: EntityKartHikariCP
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
  graphql:
    schema:
      locations: classpath:graphql/
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:change_me_in_production_min_32_chars}
  expiration: 2592000000
  refresh-secret: ${JWT_REFRESH_SECRET:change_refresh_secret_in_production}
  refresh-expiration: 31536000000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:your_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}

authorize-net:
  api-login-id: ${AUTHORIZE_NET_API_LOGIN_ID:your_login_id}
  transaction-key: ${AUTHORIZE_NET_TRANSACTION_KEY:your_transaction_key}
  environment: ${AUTHORIZE_NET_ENVIRONMENT:sandbox}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:your_razorpay_key_id}
  key-secret: ${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:your_twilio_account_sid}
  auth-token: ${TWILIO_AUTH_TOKEN:your_twilio_auth_token}
  phone-number: ${TWILIO_PHONE_NUMBER:+1XXXXXXXXXX}

admin:
  email: ${ADMIN_EMAIL:admin@entitykart.com}

app:
  url: ${APP_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000}

